<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Isometric cargo box -->
  <g transform="translate(4 4)">
    <!-- top face -->
    <polygon points="12,3 20,7.5 12,12 4,7.5" fill="#ffffff"/>
    <!-- left face -->
    <polygon points="4,7.5 12,12 12,21 4,16.5" fill="#dbe7ff"/>
    <!-- right face -->
    <polygon points="20,7.5 12,12 12,21 20,16.5" fill="#b3ccff"/>
    <!-- tape seam on top -->
    <line x1="12" y1="3" x2="12" y2="12" stroke="#93b4f5" stroke-width="0.8"/>
  </g>
</svg>
